# Pull request vers develop ou main : vérifications (AGENTS.md). Push sur develop (fusion de pull
# request comprise) : vérifications, image publiée sur ghcr.io, puis recette mise à jour.
# La pile de recette (compose.yaml, .env) est décrite et déposée sur le serveur par stock-api
# (deploy/recette) ; ce dépôt n'y remplace que le service « web ».
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  # Relance à la main (Actions → CI → Run workflow), par exemple une fois le serveur prêt.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Types des routes (PageProps, LayoutProps) générés sans build complet.
      - run: npx next typegen && npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  image:
    name: Image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # « develop » suit la branche ; le SHA du commit permet de revenir à une version.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stock-web:develop
            ghcr.io/${{ github.repository_owner }}/stock-web:${{ github.sha }}
          cache-from: type=gha,scope=stock-web
          cache-to: type=gha,mode=max,scope=stock-web

  deploy:
    name: Recette
    # Inactif tant que la variable RECETTE_SSH_HOST n'est pas définie (Settings → Variables).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.RECETTE_SSH_HOST != ''
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    environment:
      name: recette
      url: ${{ vars.RECETTE_URL }}
    # Un déploiement à la fois par dépôt ; deploy.sh fait attendre celui de l'autre dépôt.
    concurrency:
      group: deploy-recette-web
      cancel-in-progress: false
    steps:
      - name: Clé SSH
        env:
          SSH_KEY: ${{ secrets.RECETTE_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.RECETTE_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # La clé ne peut lancer que deploy.sh (deploy/recette dans stock-api) ; le jeton éphémère
      # de ce workflow, passé sur l'entrée standard, lui sert à lire les images privées.
      - name: Mise à jour du composant web
        env:
          SSH_TARGET: ${{ vars.RECETTE_SSH_USER }}@${{ vars.RECETTE_SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh "$SSH_TARGET" deploy web "$GITHUB_SHA" "$GITHUB_ACTOR"
